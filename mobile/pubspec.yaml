name: fungal_forecast
description: "FungalForecast - leaf photo + hyperlocal weather => same-day fungal disease risk forecast and costed treatment plan for smallholder farmers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_tts: ^4.2.5
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
